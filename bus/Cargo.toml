[package]
name = "bus"
version = "0.1.0"
edition.workspace = true

# Everything that needs a runtime lives here rather than in `shared`, so `shared`
# stays a plain data crate that anything in the workspace can depend on without
# pulling in tokio and a NATS client.
[dependencies]
async-nats = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
# `Tx` hands each event's `occurred_at` to the projector it wraps, which is the
# only clock an apply may read.
chrono = { workspace = true }
# `publish_event` stamps the actor onto each envelope.
uuid = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

# sqlx is gone from this crate: `bus` was ported first because `Projector::apply` and
# `outbox::enqueue` are what every service's write path threads a connection through.
diesel = { workspace = true }
diesel-async = { workspace = true }

shared = { path = "../shared" }

# `examples/demo_seed.rs` only. Dev-dependencies, so no service build pays for them, and
# all are already in the workspace graph, so nothing new compiles. argon2 hashes the demo
# password; a booking's `ends_at` is its last slot in the spot's own zone (chrono-tz);
# MEDIA_BASE is read from spot-service's .env (dotenvy); and the seed triggers each
# service's `/internal/backfill` over HTTP (reqwest).
[dev-dependencies]
argon2 = { workspace = true }
chrono-tz = { workspace = true }
dotenvy = { workspace = true }
reqwest = { workspace = true }
