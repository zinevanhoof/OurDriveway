[package]
name = "bus"
version = "0.1.0"
edition.workspace = true

# Everything that needs a runtime lives here rather than in `shared`, so `shared`
# stays a plain data crate that anything in the workspace can depend on without
# pulling in tokio and a NATS client.
[dependencies]
async-nats = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

surrealdb = { workspace = true }

shared = { path = "../shared" }

# `examples/seed.rs` only. Dev-dependencies, so no service build pays for them —
# and all three are already in the workspace graph, so nothing new compiles.
[dev-dependencies]
argon2 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
