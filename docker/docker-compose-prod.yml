# Shared config for the three SurrealDB instances. Anchored because the only
# thing that differs between them is the port and which schema they import.
x-surrealdb: &surrealdb
  # Pinned to match the `surrealdb` crate version in Cargo.toml. `:latest` and
  # `:main` are moving targets (3.1.5 and a nightly at time of writing) and drift
  # between dev and prod is not something you want under a projection store.
  image: surrealdb/surrealdb:v3.2.1
  restart: unless-stopped
  # ponytail: the image runs as `nonroot`, but a fresh named volume is created
  # root-owned, so the datastore can't be written. Running the DB process as root
  # *inside its own container* is the cheap fix. Upgrade path if it ever matters:
  # an init container that chowns the volume to uid 65532 first.
  user: "0:0"
  command:
    - start
    - --log=info
    - --user=root
    - --pass=root
    - --import-file
    - /schema.surql
    # Persistent datastore. Without this SurrealDB defaults to `memory` and every
    # restart wipes the app. Requires every DEFINE in the schema to be OVERWRITE,
    # since --import-file re-runs against an existing database on each boot.
    - surrealkv:/data/db
  healthcheck:
    # The image is distroless (no shell), so this must be the exec form against
    # the binary. Note the subcommand is `is-ready`, not `isready`.
    test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

# The databases deliberately publish NO host ports. Services reach them by
# compose service name over the bridge network. Publishing them exposed a
# root/root SurrealDB (raw /sql included) on the host — fine on a laptop, a
# straightforward takeover on a public box. The dev compose files still publish
# them, because there the services run natively on the host.
services:
  # The event log. Once services are event-sourced this is the source of truth,
  # not a transport buffer — hence file storage on a volume, and a backup story.
  # Single node here; three (odd, for quorum) once losing it would mean losing
  # data rather than just an outage.
  nats:
    image: nats:alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  user-service-db:
    <<: *surrealdb
    volumes:
      - user-db-data:/data
      - ../schemas/user-schema.surql:/schema.surql:ro

  booking-service-db:
    <<: *surrealdb
    volumes:
      - booking-db-data:/data
      - ../schemas/booking-schema.surql:/schema.surql:ro

  spot-service-db:
    <<: *surrealdb
    volumes:
      - spot-db-data:/data
      - ../schemas/spot-schema.surql:/schema.surql:ro

  # The combined read model. Rebuildable from the log, so losing this volume
  # costs a replay, not data.
  view-service-db:
    <<: *surrealdb
    volumes:
      - view-db-data:/data
      - ../schemas/view-schema.surql:/schema.surql:ro

  user-service:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    environment:
      SURREALDB_ADDR: user-service-db:8000
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION}
    depends_on:
      user-service-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # /readyz, not /healthz: an instance that is up but still replaying the log
      # must not receive traffic. Generous retries — a cold start replays a stream.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  booking-service:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: booking-service
    environment:
      SURREALDB_ADDR: booking-service-db:8000
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      booking-service-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # /readyz, not /healthz: an instance that is up but still replaying the log
      # must not receive traffic. Generous retries — a cold start replays a stream.
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  spot-service:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: spot-service
    environment:
      SURREALDB_ADDR: spot-service-db:8000
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY}
    volumes:
      - spot-uploads:/app/uploads
    depends_on:
      spot-service-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # /readyz, not /healthz: an instance that is up but still replaying the log
      # must not receive traffic. Generous retries — a cold start replays a stream.
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  # Serves every client read from one endpoint, projected from all the streams.
  view-service:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: view-service
    environment:
      SURREALDB_ADDR: view-service-db:8000
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      view-service-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # A cold start replays every stream from sequence 1, so this can legitimately
      # take a while on a wiped volume — hence the generous retry budget.
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/readyz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  # Single origin for every client (browser + tauri): serves the built SPA and
  # reverse-proxies /api/* to the 3 Rust services by their compose service names
  # over the shared bridge network. Paths are relative to this file's dir.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/frontend/dist:/srv/dist:ro
    depends_on:
      view-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      spot-service:
        condition: service_healthy

volumes:
  nats-data:
  spot-uploads:
  user-db-data:
  booking-db-data:
  spot-db-data:
  view-db-data:
