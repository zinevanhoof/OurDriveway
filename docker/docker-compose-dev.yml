# The only compose topology left: the databases plus Caddy on the host network,
# so a phone on the LAN reaches one origin. The Rust services run natively on the
# host (the "run-all-services" VS Code task), which is why none of them appear
# below — including media-service, which is reached on :3004 through the Caddy
# route in Caddyfile-dev.
#
# Production is Kubernetes, not compose. See k8s/.
x-surrealdb:
  &surrealdb # Pinned to match the `surrealdb` crate version in Cargo.toml.
  image: surrealdb/surrealdb:v3.2.4
  restart: unless-stopped
  # Still root: with no volume the datastore goes in the container's own writable
  # layer, and `nonroot` cannot mkdir /data at the filesystem root.
  user: "0:0"
  command:
    - start
    - --log=info
    - --user=root
    - --pass=root
    - --import-file
    - /schema.surql
    # surrealkv in the container's own layer — a real on-disk datastore that dies
    # with the container. Disk-backed like production, disposable like a cache,
    # which is exactly what k8s gets from its emptyDir. Requires every DEFINE in
    # the schema to be OVERWRITE, since --import-file re-runs on each boot.
    - surrealkv:/data/db
  healthcheck:
    # Distroless image (no shell), so exec form only. Subcommand is `is-ready`.
    test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  # The event log. Published on the host port because in this topology the Rust
  # services run natively, outside compose.
  nats:
    image: nats:2.14.4-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  user-service-db:
    <<: *surrealdb
    ports:
      - "8000:8000"
    volumes:
      - ../schemas/user-schema.surql:/schema.surql:ro

  booking-service-db:
    <<: *surrealdb
    ports:
      - "8001:8000"
    volumes:
      - ../schemas/booking-schema.surql:/schema.surql:ro

  spot-service-db:
    <<: *surrealdb
    ports:
      - "8002:8000"
    volumes:
      - ../schemas/spot-schema.surql:/schema.surql:ro

  # The combined read model. Rebuildable from the log, so losing this volume
  # costs a replay, not data.
  view-service-db:
    <<: *surrealdb
    ports:
      - "8003:8000"
    volumes:
      - ../schemas/view-schema.surql:/schema.surql:ro

  # Single origin for every client (browser + tauri): serves the built SPA and
  # reverse-proxies /api/* to the 5 Rust services running on the host. Same-origin
  # is what keeps the SameSite=Strict refresh cookie working and CORS unnecessary
  # — the one deliberate exception is the PUT straight to R2, which carries a
  # signature instead of a cookie.
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile-dev:/etc/caddy/Caddyfile:ro
      - ../apps/frontend/dist:/srv/dist:ro

