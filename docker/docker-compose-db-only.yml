# Dev topology: just the databases. Services run natively via `cargo run`, the
# frontend via `npm run dev` (vite proxies /api/* to localhost:3000/3001/3002).
#
# Same DB config as docker-compose-prod.yml, deliberately — dev/prod parity on
# the database version and storage engine matters more than anywhere else here.
x-surrealdb: &surrealdb
  # Pinned to match the `surrealdb` crate version in Cargo.toml.
  image: surrealdb/surrealdb:v3.2.1
  restart: unless-stopped
  # ponytail: the image runs as `nonroot`, but a fresh named volume is created
  # root-owned, so the datastore can't be written. Running the DB process as root
  # *inside its own container* is the cheap fix. Upgrade path if it ever matters:
  # an init container that chowns the volume to uid 65532 first.
  user: "0:0"
  command:
    - start
    - --log=info
    - --user=root
    - --pass=root
    - --import-file
    - /schema.surql
    # Persistent datastore — without this every restart wipes your dev data.
    # Requires every DEFINE in the schema to be OVERWRITE.
    - surrealkv:/data/db
  healthcheck:
    # Distroless image (no shell), so exec form only. Subcommand is `is-ready`.
    test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  # The event log. Published on the host port because in this topology the Rust
  # services run natively, outside compose.
  nats:
    image: nats:alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  user-service-db:
    <<: *surrealdb
    ports:
      - "8000:8000"
    volumes:
      - user-db-data:/data
      - ../schemas/user-schema.surql:/schema.surql:ro

  booking-service-db:
    <<: *surrealdb
    ports:
      - "8001:8000"
    volumes:
      - booking-db-data:/data
      - ../schemas/booking-schema.surql:/schema.surql:ro

  spot-service-db:
    <<: *surrealdb
    ports:
      - "8002:8000"
    volumes:
      - spot-db-data:/data
      - ../schemas/spot-schema.surql:/schema.surql:ro

  # The combined read model. Rebuildable from the log, so losing this volume
  # costs a replay, not data.
  view-service-db:
    <<: *surrealdb
    ports:
      - "8003:8000"
    volumes:
      - view-db-data:/data
      - ../schemas/view-schema.surql:/schema.surql:ro

volumes:
  nats-data:
  user-db-data:
  booking-db-data:
  spot-db-data:
  view-db-data:
