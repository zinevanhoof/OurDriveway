# Chart defaults. Each environment overrides these in k8s/environments/<env>/values.yaml.
#
# No environment variables live here. A service's config is k8s/environments/<env>/config/
# <name>.env, its secrets are k8s/environments/<env>/secrets.env, and deploy.sh turns both
# into cluster objects before running Helm. The only env the chart writes itself is the
# wiring it owns: PORT, DATABASE_URL and NATS_URL.
registry: ghcr.io/zinevanhoof

# Set to a commit sha to pin a release or a rollback; CI pushes one per merge to main.
tag: latest

# Kubernetes' default for `latest`. Right for a deployed environment, wrong on a laptop,
# where it would discard the image you just imported into k3d — local sets IfNotPresent.
imagePullPolicy: Always

# Every backend listens on this inside its container, behind its own Service.
port: 80

# Default for every backend; one can set its own `replicas`.
replicas: 1

# The one NATS account every service connects as; its password is NATS_PASSWORD. Anchored
# because the broker's `authorization` block below must name the same user as NATS_URL.
natsUser: &natsUser ourdriveway

# Created by deploy.sh, never templated: Helm keeps every rendered value in its release
# secret and prints it back with `helm get values`. The NATS subchart cannot read this key,
# so `nats.container.env` below spells the name out again — keep the two equal.
secretName: ourdriveway-secrets

# The backends. The key is load-bearing three times: the image is
# ourdriveway-<name>-service, the database is <name>, and the ingress path is /api/<name>.
#
#   secrets    the keys this service gets from the Secret — exactly what its Config reads,
#              never the whole Secret, so one compromised pod is not every credential.
#              YSQL_PASSWORD and NATS_PASSWORD are not listed: the chart wires them into
#              DATABASE_URL and NATS_URL.
#   db: false  no database: no DATABASE_URL, no wait-for-yugabyte
#   nats: false  no broker: no NATS_URL, no wait-for-nats
#   api: false   no ingress path
#   resources  overrides `serviceResources` for this one service
services:
  user:
    secrets: [JWT_SECRET, EMAIL_TOKEN_SECRET]
    # Argon2 takes 19 MiB per concurrent hash, at most one per CPU. 85 MiB peak measured
    # at 200 concurrent logins on 4 cores; the limit leaves room for 8.
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi
  booking:
    secrets: [JWT_SECRET]
  spot:
    secrets: [JWT_SECRET, LOCATIONIQ_API_KEY]
  view:
    secrets: [JWT_SECRET]
  payment:
    secrets: [JWT_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET]
  # Mints presigned R2 upload URLs and holds nothing.
  media:
    db: false
    nats: false
    secrets: [JWT_SECRET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY]
  # Consumes the log, its cursor lives in NATS. Exposes only health, so no ingress.
  notification:
    db: false
    api: false
    secrets: [RESEND_API_KEY, EMAIL_TOKEN_SECRET]

# Measured on a 4-CPU / 8 GB k3d node: 2–4 MiB idle, view-service peaked at 11 MiB at
# 5,000 req/s. The memory limit stops one leaking pod from taking the node. No CPU limit:
# throttling mid-request helps nobody, and the request already sets each pod's share.
serviceResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# The authoritative store — see templates/yugabyte.yaml. Its PVC is the one thing here
# whose loss is data loss.
yugabyte:
  # >= 2025.2 and started through `yugabyted`: that pair enables Read Committed, which
  # booking-service's reserve path needs to not double-book. A correctness constraint.
  # Keep in step with docker/docker-compose-dev.yml.
  image: yugabytedb/yugabyte:2026.1.1.2-b9
  storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
  # Untuned, a tserver sizes itself to the whole node. Each environment caps it.
  tserverFlags: ""
  masterFlags: ""
  # No `replicas`: this template is single-node. Multi-node needs `--join` and a
  # replication factor, which is a different template, not a knob.

frontend:
  # Caddy serving the built SPA and nothing else; routing is the Ingress's.
  replicas: 1

ingress:
  # Traefik, because k3s ships it — local and production run the same controller.
  className: traefik
  # Controller-specific annotations, if ever needed. The rate-limit and priority ones are
  # added by templates/ingress.yaml.
  annotations: {}
  # One host for the SPA and the API: the refresh cookie is SameSite=Strict, so the moment
  # /api lives on another origin, login breaks. Empty matches any host.
  host: ""
  tls:
    enabled: false
    # Created by hand, not by this chart — see k8s/README.md.
    secretName: ourdriveway-tls

# Per-client limits at Traefik — see templates/rate-limit.yaml for how a client is
# identified, templates/ingress.yaml for which paths get which limit.
rateLimit:
  enabled: true
  # Empty: the connection address, which behind k3s is a node address shared by every
  # visitor. Prod sets CF-Connecting-IP.
  sourceHeader: ""
  # Everything under /api: only bites something scripted.
  api:
    average: 20
    period: 1s
    burst: 60
  # login, signup, password forgot/reset, email resend/verify — each an Argon2 hash or an
  # email. Ten quick tries, then 5 a minute.
  auth:
    average: 5
    period: 1m
    burst: 10

# Subchart values. `helm show values nats/nats` is the authority if these keys move.
nats:
  # A debug shell nothing uses; `kubectl run --rm -it --image=natsio/nats-box` when needed.
  natsBox:
    enabled: false

  # Read by the `authorization` block below. Must name `secretName` above.
  container:
    env:
      NATS_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: ourdriveway-secrets
            key: NATS_PASSWORD

  config:
    # No anonymous connections: otherwise anything reaching :4222 could publish a
    # PaymentSucceeded. `<< $VAR >>` is the chart's unquoted-token syntax, and the server
    # resolves $NATS_PASSWORD from its environment, so the password never lands in the
    # ConfigMap. Monitoring (8222) stays open to probes only — see network-policy.yaml.
    merge:
      authorization:
        user: *natsUser
        password: << $NATS_PASSWORD >>
    jetstream:
      enabled: true
      # Event streams are kept forever: this PVC is what projections rebuild from.
      fileStore:
        enabled: true
        pvc:
          size: 5Gi
    cluster:
      # Three nodes (odd, for quorum) the day losing this pod matters.
      enabled: false
