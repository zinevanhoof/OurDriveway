# The SurrealDB schemas, injected by `--set-file` from the real schemas/*.surql.
#
# A Helm template may only read files inside its own chart directory, and these
# live in schemas/ where the Rust build already uses them. Copying them in here
# would give the repo two copies to keep in sync, and they would drift the first
# time someone edited only one. `--set-file` is the native way across that line —
# see deploy.sh, which passes all four.
#
# Keys are rebuilt as <name>-schema.surql so the mount path in services.yaml is
# derivable from the service name and nothing has to list the files twice.
{{- range $name, $svc := .Values.services }}
{{- if not (hasKey $.Values.schemas $name) }}
  {{- /* Loud at template time. A silently missing schema would otherwise start a
        database with no tables, which fails much later and much less obviously. */}}
  {{- fail (printf "no schema for %s-service — install with k8s/deploy.sh, or pass --set-file schemas.%s=schemas/%s-schema.surql" $name $name $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.schemaConfigMap }}
data:
  {{- range $name, $content := .Values.schemas }}
  {{ $name }}-schema.surql: |
{{ $content | indent 4 }}
  {{- end }}
