{{/*
One template for every backend. A pod is a service plus its OWN SurrealDB
sidecar — that pairing is not an optimisation, it is what bus/src/projector.rs
requires: every instance creates an *ephemeral* consumer and replays the whole
stream into its own database, keeping its cursor in that same database. Point two
replicas at one shared DB and you get two projectors racing over one cursor.

Sidecar-per-pod makes "a database per replica" fall out of `replicas: N` for free,
and the DB is reachable only from inside its own pod.

`stateless: true` in values.yaml opts a service out of all of it — no sidecar, no
schema, no NATS wait, no data volume. media-service is the only one: it mints
presigned R2 upload URLs and stores nothing, so there is no projection to build
and nothing for a second replica to race over.
*/}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app.kubernetes.io/name: {{ $name }}-service
spec:
  replicas: {{ $svc.replicas | default $.Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-service
      annotations:
        # Rolls the pods when a schema changes. The ConfigMap keeps a stable name,
        # so without this it would mutate underneath running pods and only take
        # effect at the next unrelated restart — a 3am kind of bug.
        checksum/schemas: {{ $.Values.schemas | toYaml | sha256sum }}
    spec:
      {{- if not $svc.stateless }}
      securityContext:
        # The SurrealDB image runs as uid 65532 (nonroot) and a fresh emptyDir is
        # root-owned, so without this the datastore cannot be written. fsGroup
        # makes the kubelet chown it — the clean version of the `user: "0:0"`
        # workaround the compose file needed.
        fsGroup: 65532
      initContainers:
        # Kubernetes has no `depends_on`, so the compose file's
        # `nats: condition: service_healthy` becomes this: a plain init container
        # that blocks until the broker answers. bus/src/connect.rs dials once and
        # gives up, so without it a pod that boots ahead of NATS just CrashLoops
        # until NATS happens to win the race.
        #
        # Reuses the app image — already pulled for this pod — and bash's
        # /dev/tcp builtin, so there is no netcat, no nats CLI and no second
        # image to keep pinned. Dialling the ClusterIP Service and not a pod is
        # what makes a bare TCP check enough: kube-proxy only routes to endpoints
        # that passed the NATS chart's own readiness probe, JetStream included.
        - name: wait-for-nats
          image: {{ $.Values.registry }}/ourdriveway-{{ $name }}-service:{{ $.Values.tag }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command:
            - bash
            - -c
            # Quoted: unquoted, `until : <…` is a YAML mapping key, not a string.
            - 'until : </dev/tcp/{{ $.Release.Name }}-nats/4222; do echo "waiting for nats"; sleep 2; done'
        # A native sidecar (initContainer + restartPolicy: Always), not a plain
        # container. shared/src/db.rs connects once at boot and does NOT retry, so
        # the app must not start until the socket is accepting. Only a native
        # sidecar's startupProbe gives that ordering guarantee inside a pod.
        # Needs Kubernetes >= 1.29.
        - name: surrealdb
          image: {{ $.Values.surrealdb.image }}
          restartPolicy: Always
          args:
            - start
            - --log=info
            # Same values the app is given below, from one place in values.yaml.
            - --user={{ $.Values.surrealdb.user }}
            - --pass={{ $.Values.surrealdb.pass }}
            # Bound to loopback on purpose. Container ports are namespaced per
            # pod, but 0.0.0.0 would still answer on the pod IP — i.e. a root/root
            # SurrealDB, /sql included, reachable from every other pod in the
            # cluster. Loopback makes it genuinely private to this pod, which is
            # what lets root/root stay unremarkable.
            - --bind=127.0.0.1:8000
            # Re-imported on every boot, which is why every DEFINE in the schemas
            # is OVERWRITE. With a disposable datastore this is the only thing
            # that puts the tables there at all.
            - --import-file
            - /schemas/{{ $name }}-schema.surql
            - {{ $.Values.surrealdb.storage }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: schemas
              mountPath: /schemas
              readOnly: true
          startupProbe:
            # The image is distroless — no shell, no curl. Exec the binary
            # directly, and note the subcommand is `is-ready`, not `isready`.
            exec:
              command: ["/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
            periodSeconds: 2
            failureThreshold: 30
      {{- end }}
      containers:
        - name: app
          image: {{ $.Values.registry }}/ourdriveway-{{ $name }}-service:{{ $.Values.tag }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
          # Every variable the service's Config struct requires. There are no
          # defaults left in the code, so an omission here crashes the pod at
          # startup rather than surfacing as a 500 later — which is the point.
          env:
            - name: PORT
              value: {{ $.Values.port | quote }}
            {{- if not $svc.stateless }}
            # The sidecar in this same pod, on loopback.
            - name: SURREALDB_ADDR
              value: "127.0.0.1:8000"
            - name: SURREALDB_USER
              value: {{ $.Values.surrealdb.user | quote }}
            - name: SURREALDB_PASS
              value: {{ $.Values.surrealdb.pass | quote }}
            - name: NATS_URL
              value: "nats://{{ $.Release.Name }}-nats:4222"
            - name: SNAPSHOT_INTERVAL_SECS
              value: {{ $.Values.snapshotIntervalSecs | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # JWT_SECRET for every service, plus LOCATIONIQ_API_KEY and the R2
          # credentials. See secrets.env.example.

          envFrom:
            - secretRef:
                name: {{ $.Values.secretName }}
          # /readyz means "my projection has caught up with the log", so this is
          # what keeps a replaying pod out of the Service's endpoint list. It
          # replaces the `health_uri /readyz` checks Caddy used to run, and does
          # it better: Caddy probing a ClusterIP hits a random pod and learns
          # nothing about the one it is about to dial.
          #
          # A stateless service answers both unconditionally — it has no
          # projection, so alive IS ready. Same probes, so the template stays one.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            # Generous: a cold start replays every stream from sequence 1, and
            # failing readiness only withholds traffic — it never restarts a pod.
            failureThreshold: 60
          # /healthz deliberately ignores NATS (see bus/src/health.rs). Pointing
          # liveness at /readyz instead would restart every pod in the cluster
          # during a broker blip and fix nothing.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      {{- if not $svc.stateless }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ $.Values.surrealdb.sizeLimit }}
        - name: schemas
          configMap:
            name: {{ $.Values.schemaConfigMap }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
spec:
  # This IS the load balancer. kube-proxy spreads connections across every ready
  # pod behind it, so scaling is `replicas: N` and nothing else.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}-service
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- end }}
