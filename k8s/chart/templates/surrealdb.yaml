{{/*
SurrealDB: a query engine over TiKV, holding nothing.

A Deployment and not a StatefulSet, and that is the point of the whole rewrite —
`surreal start tikv://pd:2379` stores no bytes locally, so these pods are as
disposable as any other. There is no volume, no ordinal identity and no
`--import-file`: the schemas are applied once by the Job in schema-import.yaml
rather than by every boot of every instance.

One ClusterIP for all of them. Every service dials `surrealdb:8000` and selects
its own database with `SURREALDB_DB`; the namespace is `main` for all of them.
Scaling reads is `replicas: N`.

⚠ The exposure changed with the shape. A sidecar bound to `127.0.0.1` was
genuinely private to its pod, which is what made `root`/`root` in values.yaml
unremarkable. This binds `0.0.0.0` behind a ClusterIP, so the credentials are now
the only thing between any pod in the namespace and a root session — they come
from `app-secrets` (SURREALDB_USER/PASS in k8s/secrets.env), read here through
SurrealDB's own SURREAL_USER/SURREAL_PASS, and by the services from the same two
keys so the pair cannot drift.

That is authentication, not reachability. A NetworkPolicy admitting only the
service pods is the next rung, and worth taking on any cluster running something
that is not this app.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: surrealdb
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  labels:
    app.kubernetes.io/name: surrealdb
spec:
  replicas: {{ .Values.surrealdb.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
    spec:
      initContainers:
        # Waits for the cluster to be **bootstrapped**, not merely for PD to answer.
        #
        # The distinction is the difference between working and CrashLoopBackOff, and
        # it took a real install to see: PD serves its API the moment it is up, but
        # SurrealDB's startup health probe fails with `cluster is not bootstrapped`
        # until a TiKV store has registered and the first region exists. Waiting on
        # PD's port alone let SurrealDB start into that gap and exit.
        #
        # `is_initialized` is PD's own name for exactly this. Not circular: what
        # flips it is a store registering, which does not involve SurrealDB.
        - name: wait-for-cluster
          image: {{ .Values.curlImage }}
          command: ["sh", "-c"]
          args:
            - |
              until curl -sf http://pd:2379/pd/api/v1/cluster/status 2>/dev/null \
                    | grep -q '"is_initialized": *true'; do
                echo "waiting for tikv cluster to bootstrap"
                sleep 2
              done
      containers:
        - name: surrealdb
          image: {{ .Values.surrealdb.image }}
          args:
            - start
            - --log=info
            - --bind=0.0.0.0:8000
            - tikv://pd:2379
          # The root credentials, as SurrealDB's own env names. Not `--user`/`--pass`
          # args: those are readable in the pod spec by anyone with `get pods`, and
          # they are no longer the loopback-only credentials that made that fine.
          #
          # SURREALDB_USER/PASS in the same secret are what the services send, so one
          # entry in k8s/secrets.env sets both sides.
          env:
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SURREALDB_USER
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SURREALDB_PASS
          ports:
            - name: http
              containerPort: 8000
          # The image is distroless — no shell, no curl — so the HTTP probes below
          # are the readable option. `/health` answers only once the datastore is
          # reachable, which is exactly the question being asked: this pod is
          # useless while TiKV is not there, however alive its process is.
          #
          # The startup probe is what makes the other two safe, and leaving it out
          # was a real bug: against a cold TiKV, SurrealDB spends tens of seconds
          # connecting, initialising credentials and creating the root user before it
          # listens at all, and a liveness probe with no start delay spends that
          # whole time collecting `connection refused` and then kills it. Measured —
          # three restarts in six minutes on a first install, each one throwing away
          # a container that was seconds from being fine.
          #
          # Kubernetes suspends liveness and readiness until this passes, so slack
          # here costs nothing and a slow first boot is no longer a crash loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            # Deliberately slack. A TiKV blip must not restart every query engine
            # in the cluster — readiness already withholds traffic, which is the
            # response that actually helps.
            failureThreshold: 12
          resources: {{- toYaml .Values.surrealdb.resources | nindent 12 }}
