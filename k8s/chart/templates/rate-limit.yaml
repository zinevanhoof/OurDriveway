{{/*
Per-client rate limits, enforced by Traefik before a request reaches any service.
Attached per Ingress — see templates/ingress.yaml for which paths get which.

Traefik's limiter is a token bucket per source: `burst` requests may arrive at once,
then it refills at `average` per `period`. Over the limit is a 429 with no body, and
the service never sees the request.

**What "per client" means depends on `rateLimit.sourceHeader`.**

  set (prod: CF-Connecting-IP)
      Cloudflare writes the visitor's address into that header on every request it
      proxies. Only trustworthy because the VPS firewall admits 80/443 from
      Cloudflare's ranges alone — reachable directly, anyone could send their own
      value and get a fresh bucket per request. That lockdown is what makes this
      header mean anything.

  empty (local)
      The connection's remote address. Behind k3s's service load balancer that is a
      node address, not the visitor's, so every client shares one bucket — fine for a
      laptop, useless in front of the internet.

The state is per Traefik replica and in memory, which k3s runs one of — so a limit
here is the limit, and it resets when Traefik restarts.
*/}}
{{- define "ourdriveway.rateLimitSource" }}
{{- with .Values.rateLimit.sourceHeader }}
    sourceCriterion:
      requestHeaderName: {{ . }}
{{- end }}
{{- end }}
{{- if .Values.rateLimit.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-rate-limit
spec:
  rateLimit:
    average: {{ .Values.rateLimit.api.average }}
    period: {{ .Values.rateLimit.api.period }}
    burst: {{ .Values.rateLimit.api.burst }}
    {{- include "ourdriveway.rateLimitSource" . }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-rate-limit
spec:
  rateLimit:
    average: {{ .Values.rateLimit.auth.average }}
    period: {{ .Values.rateLimit.auth.period }}
    burst: {{ .Values.rateLimit.auth.burst }}
    {{- include "ourdriveway.rateLimitSource" . }}
{{- end }}
