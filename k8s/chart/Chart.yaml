apiVersion: v2
name: ourdriveway
description: Parking-spot booking app — seven Rust services on YugabyteDB, integrated through NATS JetStream, behind one Traefik ingress.
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  # Upstream chart rather than a hand-written StatefulSet: clustering NATS for quorum
  # later is a values change.
  #
  # Pinned exactly, not a `^` range: the chart versions track the server, and a range once
  # left prod on NATS 2.11 while the compose files moved to 2.14. Keep it in step with
  # `nats:alpine` there; an upgrade is a visible commit.
  - name: nats
    version: "2.14.2"
    repository: https://nats-io.github.io/k8s/helm/charts/
