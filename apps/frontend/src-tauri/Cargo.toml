# Its own workspace root, deliberately excluded from the root one. The Tauri app
# shares no dependencies with the backend services, and a shared target/ made
# their profiles invalidate each other on every tool switch.
[workspace]

[package]
name = "our-driveway"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "our_driveway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri-plugin-http = "2"
tauri-plugin-geolocation = "2"
# Mobile only, and only for one thing: bringing the app back after a redirect payment.
# Bancontact leaves for the customer's bank, and Stripe's return_url would otherwise land
# in the system browser — where the session doesn't exist, because plugin-http keeps the
# refresh cookie in reqwest's jar inside this process. A `ourdriveway://` link hands the
# return to the app instead, with its session intact.
tauri-plugin-deep-link = "2"

