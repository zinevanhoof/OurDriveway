[package]
name = "e2e"
version = "0.1.0"
edition.workspace = true
publish = false

# Black-box tests of the whole backend: the seven service binaries, started from
# target/debug against the dev compose file's nats + yugabyte. See src/lib.rs.
#
# `harness = false` because libtest has no setup or teardown, and the stack has to be
# booted once and killed once. libtest-mimic puts the usual CLI back on top — filters,
# `--ignored`, parallel runs — so this runs like every other test binary here.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false

[dependencies]
async-stripe-webhook = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
libtest-mimic = "0.8"
migrator = { path = "../apps/migrator" }
reqwest = { workspace = true }
serde_json = { workspace = true }
shared = { path = "../shared" }
tokio = { workspace = true }
uuid = { workspace = true }
