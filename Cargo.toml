[workspace]
members = [
    "apps/services/user-service",
    "apps/services/booking-service",
    "apps/services/spot-service",
    "apps/frontend/src-tauri",
    "shared"
]

resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Services
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
surrealdb = "3.2.1"
rustls = "0.23"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.18"
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
cookie = "0.18.1"
axum-reverse-proxy = "1.3.0"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
chrono = "0.4.45"
uuid = { version = "1.23.4", features = ["v4"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json", "query"] }
geo = "=0.32.0"
tzf-rs = "1.3.6"
garde = { version = "0.23.0", features = ["derive", "email"] }

# Frontend
tauri-build = { version = "2.6.3", features = [] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2.5.4"
